services:
  - type: web
    name: boletas-v1
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RENDER_DISK_PATH
        value: /opt/render/project/src/data
    # Base de datos PostgreSQL (gratuita)
    # Render creará automáticamente la variable DATABASE_URL
    databases:
      - name: boletas-db
        plan: free


