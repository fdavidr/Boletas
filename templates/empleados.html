<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Empleados - BOLETAS-V1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>👥 Gestión de Empleados</h1>
            <p>Registre y administre los datos de sus empleados</p>
        </div>
    </header>

    <nav class="nav">
        <div class="nav-content">
            <a href="/" class="nav-link">🏠 Inicio</a>
            <a href="/mensual" class="nav-link">📄 Boleta Mensual</a>
            <a href="/aguinaldo" class="nav-link">🎁 Aguinaldo</a>
            <a href="/liquidacion" class="nav-link">📋 Liquidación</a>
            <a href="/empleados" class="nav-link">👥 Empleados</a>
            <a href="/config" class="nav-link">⚙️ Configuración</a>
        </div>
    </nav>

    <div class="container">
        <div id="alert" class="alert"></div>

        <!-- Formulario de registro -->
        <div class="form-container fade-in">
            <h3 class="form-title">Registrar Nuevo Empleado</h3>
            
            <form id="empleadoForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="nombre_completo" class="required">Nombre Completo</label>
                        <input type="text" id="nombre_completo" name="nombre_completo" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="ci" class="required">C.I.</label>
                        <input type="text" id="ci" name="ci" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="cargo" class="required">Cargo</label>
                        <select id="cargo" name="cargo" class="form-control" required>
                            <option value="">-- Seleccionar --</option>
                            <option value="GERENTE GENERAL">GERENTE GENERAL</option>
                            <option value="OPERARIO/A">OPERARIO/A</option>
                            <option value="SUPERVISOR/A">SUPERVISOR/A</option>
                            <option value="GUARDIA">GUARDIA</option>
                            <option value="ASISTENTE">ASISTENTE</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_ingreso" class="required">Fecha de Ingreso</label>
                        <input type="date" id="fecha_ingreso" name="fecha_ingreso" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="sueldo" class="required">Sueldo (Bs.)</label>
                        <input type="number" id="sueldo" name="sueldo" class="form-control" step="0.01" required>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-success">
                        ✅ Registrar Empleado
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="limpiarFormulario()">
                        🔄 Limpiar
                    </button>
                </div>
            </form>
        </div>

        <!-- Lista de empleados -->
        <div class="form-container fade-in" style="animation-delay: 0.1s;">
            <h3 class="form-title">Empleados Registrados</h3>
            
            <div style="margin-bottom: 1rem;">
                <input type="text" id="buscar_empleado" class="form-control" 
                       placeholder="🔍 Buscar por nombre o C.I..." 
                       onkeyup="filtrarEmpleados()">
            </div>

            <div id="lista_empleados" class="table-container">
                <p style="text-align: center; color: var(--text-light); padding: 2rem;">
                    Cargando empleados...
                </p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p><strong>BOLETAS-V1</strong> © 2025 - Sistema de Gestión de Boletas de Pago</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        let empleadoEditando = null;
        let todosEmpleados = [];

        // Cargar empleados al iniciar
        document.addEventListener('DOMContentLoaded', function() {
            cargarEmpleados();
        });

        // Registrar/Actualizar empleado
        document.getElementById('empleadoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="spinner"></span> Guardando...';
            submitBtn.disabled = true;
            
            try {
                const formData = new FormData(this);
                const data = Object.fromEntries(formData);
                
                // Convertir fecha de yyyy-mm-dd a dd/mm/yyyy
                if (data.fecha_ingreso) {
                    data.fecha_ingreso = data.fecha_ingreso.split('-').reverse().join('/');
                }
                
                const url = empleadoEditando 
                    ? `/api/empleados/${empleadoEditando}` 
                    : '/api/empleados';
                
                const method = empleadoEditando ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ ' + result.message, 'success');
                    limpiarFormulario();
                    cargarEmpleados();
                } else {
                    showAlert('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });

        // Cargar empleados
        async function cargarEmpleados() {
            try {
                const response = await fetch('/api/empleados');
                const result = await response.json();
                
                if (result.success) {
                    todosEmpleados = result.empleados;
                    mostrarEmpleados(todosEmpleados);
                } else {
                    document.getElementById('lista_empleados').innerHTML = 
                        '<p style="text-align: center; color: var(--text-light); padding: 2rem;">Error al cargar empleados</p>';
                }
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('lista_empleados').innerHTML = 
                    '<p style="text-align: center; color: var(--danger-color); padding: 2rem;">Error al cargar empleados</p>';
            }
        }

        // Mostrar empleados en tabla
        function mostrarEmpleados(empleados) {
            const container = document.getElementById('lista_empleados');
            
            if (empleados.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: var(--text-light); padding: 2rem;">No hay empleados registrados</p>';
                return;
            }
            
            let html = `
                <table class="table">
                    <thead>
                        <tr>
                            <th>Nombre Completo</th>
                            <th>C.I.</th>
                            <th>Cargo</th>
                            <th>Fecha Ingreso</th>
                            <th>Sueldo</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            empleados.forEach(emp => {
                html += `
                    <tr>
                        <td>${emp.nombre_completo}</td>
                        <td>${emp.ci}</td>
                        <td>${emp.cargo}</td>
                        <td>${emp.fecha_ingreso}</td>
                        <td>${formatCurrency(emp.sueldo)} Bs.</td>
                        <td>
                            <button class="btn-icon" onclick="editarEmpleado(${emp.id})" title="Editar">
                                ✏️
                            </button>
                            <button class="btn-icon" onclick="eliminarEmpleado(${emp.id})" title="Eliminar">
                                🗑️
                            </button>
                            <a href="/historial/${emp.id}" class="btn-icon" title="Ver historial de documentos" style="text-decoration:none;">
                                📂
                            </a>
                        </td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Filtrar empleados
        function filtrarEmpleados() {
            const termino = document.getElementById('buscar_empleado').value.toLowerCase();
            
            if (termino === '') {
                mostrarEmpleados(todosEmpleados);
            } else {
                const filtrados = todosEmpleados.filter(emp => 
                    emp.nombre_completo.toLowerCase().includes(termino) ||
                    emp.ci.toLowerCase().includes(termino)
                );
                mostrarEmpleados(filtrados);
            }
        }

        // Editar empleado
        async function editarEmpleado(id) {
            try {
                const response = await fetch(`/api/empleados/${id}`);
                const result = await response.json();
                
                if (result.success) {
                    const emp = result.empleado;
                    empleadoEditando = id;
                    
                    document.getElementById('nombre_completo').value = emp.nombre_completo;
                    document.getElementById('ci').value = emp.ci;
                    document.getElementById('cargo').value = emp.cargo;
                    
                    // Convertir fecha de dd/mm/yyyy a yyyy-mm-dd
                    const fechaParts = emp.fecha_ingreso.split('/');
                    document.getElementById('fecha_ingreso').value = 
                        `${fechaParts[2]}-${fechaParts[1]}-${fechaParts[0]}`;
                    
                    document.getElementById('sueldo').value = emp.sueldo;
                    
                    // Cambiar texto del botón
                    document.querySelector('#empleadoForm button[type="submit"]').innerHTML = '💾 Actualizar Empleado';
                    
                    // Scroll al formulario
                    document.getElementById('empleadoForm').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                showAlert('❌ Error al cargar empleado: ' + error.message, 'error');
            }
        }

        // Eliminar empleado
        async function eliminarEmpleado(id) {
            if (!confirm('¿Está seguro de eliminar este empleado?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/empleados/${id}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showAlert('✅ ' + result.message, 'success');
                    cargarEmpleados();
                } else {
                    showAlert('❌ ' + result.message, 'error');
                }
            } catch (error) {
                showAlert('❌ Error: ' + error.message, 'error');
            }
        }

        // Limpiar formulario
        function limpiarFormulario() {
            document.getElementById('empleadoForm').reset();
            empleadoEditando = null;
            document.querySelector('#empleadoForm button[type="submit"]').innerHTML = '✅ Registrar Empleado';
        }
    </script>

    <style>
        .table-container {
            overflow-x: auto;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        
        .table th,
        .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        
        .table th {
            background-color: var(--primary-color);
            color: var(--white);
            font-weight: 600;
        }
        
        .table tbody tr:hover {
            background-color: var(--light-bg);
        }
        
        .btn-icon {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px;
            transition: transform 0.2s;
        }
        
        .btn-icon:hover {
            transform: scale(1.2);
        }
    </style>
</body>
</html>
